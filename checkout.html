<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout — Compostela</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<!-- Stripe.js must be loaded from Stripe's own domain; it cannot be bundled
     or self-hosted, and doing so would break PCI eligibility. -->
<script src="https://js.stripe.com/v3/"></script>
<style>
  .checkout { padding: 30px 0 70px; }
  .checkout__crumbs { font-size: 14px; color: var(--ink-soft); margin: 0 0 22px; }
  .checkout__crumbs a { text-decoration: none; }
  .checkout__crumbs a:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
  .checkout__title { font-size: clamp(34px, 4.4vw, 50px); margin: 0 0 30px; }

  .checkout__grid {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 380px);
    gap: 56px;
    align-items: start;
  }

  /* Stripe's form is the primary column and reads first on a narrow screen,
     so the summary is ordered after it on mobile and beside it on desktop. */
  .checkout__form { grid-column: 1; grid-row: 1; min-height: 420px; }

  .checkout__summary {
    grid-column: 2;
    grid-row: 1;
    position: sticky;
    top: 108px;
    border: 1px solid var(--hairline);
    border-radius: 2px;
    background: var(--bg-raised);
  }

  .summary__head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    padding: 18px 22px;
    border-bottom: 1px solid var(--hairline-soft);
  }

  .summary__head a { font-size: 14px; text-decoration: none; color: var(--ink-soft); }
  .summary__head a:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }

  .summary__lines { list-style: none; margin: 0; padding: 0; }

  .summary__line {
    display: grid;
    grid-template-columns: 52px minmax(0, 1fr) auto;
    gap: 14px;
    align-items: start;
    padding: 16px 22px;
    border-bottom: 1px solid var(--hairline-soft);
  }

  .summary__line .plate { aspect-ratio: 3 / 4; padding: 5%; }
  .summary__title { font-family: 'Cormorant Garamond', serif; font-size: 18px; line-height: 1.2; }
  .summary__detail { margin-top: 4px; font-size: 14px; color: var(--ink-soft); }
  .summary__amount { font-size: 15px; white-space: nowrap; font-variant-numeric: tabular-nums; }

  .summary__totals { padding: 16px 22px; }

  .summary__row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 16px;
    font-size: 15px;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }

  .summary__row span:last-child { font-variant-numeric: tabular-nums; }

  .summary__row--total {
    margin: 11px 0 0;
    padding-top: 11px;
    border-top: 1px solid var(--hairline-soft);
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 21px;
    color: var(--ink);
  }

  .summary__note {
    margin: 12px 22px 18px;
    font-size: 13px;
    font-style: italic;
    line-height: 1.5;
    color: var(--ink-faint);
  }

  .checkout__state { padding: 60px 0; max-width: 46ch; }
  .checkout__state h2 { font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 27px; margin: 0 0 12px; }
  .checkout__state p { color: var(--ink-soft); margin: 0 0 8px; }
  .checkout__state .btn { margin-top: 24px; }
  .checkout__detail { font-size: 14px; font-style: italic; color: var(--ink-faint); }

  .spinner {
    width: 22px; height: 22px;
    margin-bottom: 18px;
    border: 2px solid var(--hairline);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.4s; } }

  @media (max-width: 900px) {
    .checkout__grid { grid-template-columns: minmax(0, 1fr); gap: 34px; }
    .checkout__summary { grid-column: 1; grid-row: 2; position: static; }
    .checkout__form { grid-row: 1; min-height: 0; }
  }
</style>
</head>
<body>
  <header class="site-header">
    <div class="shell site-header__inner">
      <a class="wordmark" href="index.html">Compostela</a>
      <nav class="site-nav" id="siteNav" aria-label="Primary">
        <a href="gallery.html">Shop Gallery</a>
        <a href="#">Journaling</a>
        <a href="#">Daily Prayer</a>
        <a href="#">Podcast</a>
        <a href="#">Development</a>
      </nav>
      <div class="header-actions">
        <!-- No basket button here on purpose: editing the basket after the
             session is created would not change what Stripe charges. -->
        <button class="hamburger" id="navToggle" aria-label="Menu" aria-expanded="false" aria-controls="siteNav">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <main class="shell">
    <section class="checkout">
      <p class="checkout__crumbs"><a href="gallery.html">Gallery</a> &nbsp;/&nbsp; Checkout</p>
      <h1 class="display checkout__title">Checkout</h1>

      <div class="checkout__grid" id="grid" hidden>
        <div class="checkout__form" id="checkoutForm"></div>
        <aside class="checkout__summary" id="summary"></aside>
      </div>

      <div class="checkout__state" id="state">
        <div class="spinner" role="status" aria-label="Loading checkout"></div>
        <h2>Getting your order ready</h2>
        <p>One moment.</p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="shell site-footer__inner">
      <div class="site-footer__links">
        <a href="index.html">2026</a>
        <a href="https://compostela.substack.com" target="_blank" rel="noopener">Substack</a>
        <a href="#">Shipping &amp; Returns</a>
      </div>
      <img class="mark" src="logo.png" alt="Compostela logo">
    </div>
  </footer>

  <script src="assets/catalog.js"></script>
  <script src="assets/pricing.js"></script>
  <script src="assets/shop.js"></script>
  <script>
    (function () {
      Shop.init();

      var grid = document.getElementById('grid');
      var state = document.getElementById('state');
      var summary = document.getElementById('summary');
      var esc = Shop.escapeHTML;

      function showState(title, body, detail, action) {
        state.innerHTML =
          '<h2>' + esc(title) + '</h2>' +
          '<p>' + esc(body) + '</p>' +
          (detail ? '<p class="checkout__detail">' + esc(detail) + '</p>' : '') +
          '<a class="btn" href="' + (action || 'gallery.html') + '">Back to the gallery</a>';
        state.hidden = false;
        grid.hidden = true;
      }

      /* The same basket the drawer shows, priced by the same module the
         server will use — so this panel and the amount Stripe charges come
         from one place. It is read-only here by design. */
      function renderSummary(basket) {
        var m = Shop.moneyExact;
        var ship = Shop.catalog.shipping;

        summary.innerHTML =
          '<div class="summary__head">' +
            '<span class="eyebrow">Your order</span>' +
            '<a href="gallery.html">Change</a>' +
          '</div>' +
          '<ul class="summary__lines">' +
            basket.lines.map(function (line) {
              return '<li class="summary__line">' +
                Shop.plateHTML(line.work, { eager: true }) +
                '<div>' +
                  '<div class="summary__title">' + esc(line.work.title) +
                    (line.qty > 1 ? ' &times; ' + line.qty : '') + '</div>' +
                  '<div class="summary__detail">' + esc(line.description) + '</div>' +
                '</div>' +
                '<span class="summary__amount">' + m(line.total) + '</span>' +
              '</li>';
            }).join('') +
          '</ul>' +
          '<div class="summary__totals">' +
            '<div class="summary__row"><span>Subtotal</span><span>' + m(basket.total) + '</span></div>' +
            '<div class="summary__row"><span>Shipping</span><span>' + m(basket.shipping) + '</span></div>' +
            '<div class="summary__row summary__row--total"><span>Total</span><span>' + m(basket.grandTotal) + '</span></div>' +
          '</div>' +
          '<p class="summary__note">' +
            ship.minDays + '&ndash;' + ship.maxDays + ' days from order to delivery. ' +
            'Tax, if any, is added by Stripe at payment.' +
          '</p>';
      }

      var items = Shop.items();

      if (!items.length) {
        showState('Your basket is empty',
          'There is nothing here to pay for yet.');
        return;
      }

      var basket = Shop.resolveCart(items);

      if (!basket.ok) {
        showState('Something in your basket is no longer available',
          basket.errors.join(' '),
          'Its price or availability changed after it was added.');
        return;
      }

      if (!window.Stripe) {
        // js.stripe.com did not load — an ad blocker, or a network fault.
        showState('Could not load the payment form',
          'Stripe’s payment library did not load. A privacy extension or ' +
          'network filter is the usual cause.',
          'Try again with extensions disabled, or in a private window.');
        return;
      }

      fetch('/api/checkout', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ items: items })
      })
        .then(function (response) {
          return response.json().then(function (data) {
            if (!response.ok) throw new Error(data && data.error);
            return data;
          });
        })
        .then(function (data) {
          if (!data.clientSecret || !data.publishableKey) {
            throw new Error('Checkout is not configured yet.');
          }

          renderSummary(basket);
          state.hidden = true;
          grid.hidden = false;

          // Stripe fetches the secret through this callback rather than
          // taking it directly, so it can refetch if the session is recreated.
          return Stripe(data.publishableKey).initEmbeddedCheckout({
            fetchClientSecret: function () { return Promise.resolve(data.clientSecret); }
          });
        })
        .then(function (embedded) {
          if (embedded) embedded.mount('#checkoutForm');
        })
        .catch(function (err) {
          showState('Checkout is unavailable right now',
            'Nothing has been charged, and your basket is exactly as you left it.',
            err && err.message ? err.message : 'Could not reach the payment provider.');
        });
    })();
  </script>
</body>
</html>
