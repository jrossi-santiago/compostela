<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Compostela — Coming Soon</title>
<meta name="description" content="Compostela is coming soon. Sign up to be the first to know when we launch.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #e5d9c3;
    --bg-soft: #ece2cf;
    --ink: #2b2118;
    --ink-soft: #5c5142;
    --hairline: rgba(43, 33, 24, 0.22);
    --accent: #2c1930;
    --accent-hover: #3d2343;
    --accent-ink: #f3ead9;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'EB Garamond', Georgia, 'Times New Roman', serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    min-height: 100dvh;
    padding: 24px;
  }

  .frame {
    width: 100%;
    max-width: 620px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(18px, 3vh, 28px);
  }

  .wordmark {
    font-family: 'Cormorant Garamond', 'EB Garamond', Georgia, serif;
    font-weight: 500;
    letter-spacing: 0.42em;
    text-transform: uppercase;
    font-size: clamp(22px, 4vw, 30px);
    color: var(--ink);
    margin: 0;
  }

  .rule {
    width: 64px;
    height: 1px;
    background: var(--hairline);
    margin: 0;
  }

  .eyebrow {
    font-family: 'EB Garamond', serif;
    font-size: 12px;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 0;
  }

  h1 {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 500;
    font-style: italic;
    font-size: clamp(34px, 6vw, 56px);
    line-height: 1.15;
    margin: 0;
    color: var(--ink);
  }

  .tagline {
    font-family: 'EB Garamond', serif;
    font-size: clamp(15px, 2vw, 17px);
    line-height: 1.6;
    color: var(--ink-soft);
    max-width: 440px;
    margin: 0;
  }

  form {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 4px;
  }

  .field-row {
    display: flex;
    gap: 10px;
  }

  input[type="email"] {
    flex: 1;
    min-width: 0;
    background: var(--bg-soft);
    border: 1px solid var(--hairline);
    color: var(--ink);
    font-family: 'EB Garamond', serif;
    font-size: 16px;
    padding: 14px 16px;
    outline: none;
    transition: border-color 0.2s ease;
  }

  input[type="email"]::placeholder {
    color: var(--ink-soft);
    opacity: 0.8;
  }

  input[type="email"]:focus {
    border-color: var(--accent);
  }

  button {
    background: var(--accent);
    color: var(--accent-ink);
    border: none;
    font-family: 'EB Garamond', serif;
    font-size: 13px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    padding: 14px 24px;
    cursor: pointer;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: background 0.2s ease;
  }

  button:hover {
    background: var(--accent-hover);
  }

  button:disabled {
    opacity: 0.6;
    cursor: default;
  }

  .arrow {
    font-size: 14px;
    transform: translateY(-1px);
  }

  .status {
    min-height: 20px;
    font-size: 13px;
    letter-spacing: 0.05em;
    color: var(--ink-soft);
    margin: 0;
  }

  .status.success { color: var(--accent); }
  .status.error { color: #7a2e2e; }

  .footer-note {
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--ink-soft);
    opacity: 0.7;
    margin: 0;
  }

  @media (max-width: 420px) {
    .field-row {
      flex-direction: column;
    }
  }
</style>
</head>
<body>
  <main class="frame">
    <p class="wordmark">Compostela</p>
    <div class="rule"></div>
    <p class="eyebrow">Coming Soon</p>
    <h1>Something considered<br>is on its way.</h1>
    <p class="tagline">We're putting the finishing touches on Compostela. Leave your email and we'll let you know the moment we open our doors.</p>

    <form id="signup-form" action="https://formspree.io/f/xgawvkvj" method="POST">
      <div class="field-row">
        <input type="email" name="email" placeholder="Your email address" required aria-label="Email address">
        <button type="submit" id="submit-btn">
          <span id="btn-label">Notify Me</span>
          <span class="arrow" aria-hidden="true">&#8594;</span>
        </button>
      </div>
      <p class="status" id="form-status" role="status" aria-live="polite"></p>
    </form>

    <p class="footer-note">&copy; 2026 Compostela</p>
  </main>

  <script>
    const form = document.getElementById('signup-form');
    const status = document.getElementById('form-status');
    const btn = document.getElementById('submit-btn');
    const btnLabel = document.getElementById('btn-label');

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      status.textContent = '';
      status.className = 'status';
      btn.disabled = true;
      btnLabel.textContent = 'Sending…';

      try {
        const response = await fetch(form.action, {
          method: 'POST',
          body: new FormData(form),
          headers: { 'Accept': 'application/json' }
        });

        if (response.ok) {
          form.reset();
          btnLabel.textContent = 'Notify Me';
          status.textContent = "You're on the list. Thank you.";
          status.classList.add('success');
        } else {
          const data = await response.json().catch(() => null);
          const message = data && data.errors && data.errors.length
            ? data.errors.map(err => err.message).join(', ')
            : 'Something went wrong. Please try again.';
          btnLabel.textContent = 'Notify Me';
          status.textContent = message;
          status.classList.add('error');
        }
      } catch (err) {
        btnLabel.textContent = 'Notify Me';
        status.textContent = 'Something went wrong. Please try again.';
        status.classList.add('error');
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
