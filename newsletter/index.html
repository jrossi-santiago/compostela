<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compostela Press — Coming Soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #e5d9c3;
    --input-bg: #ece2cf;
    --ink: #2b2118;
    --ink-soft: #5c5142;
    --hairline: rgba(43, 33, 24, 0.22);
    --accent: #2c1930;
    --accent-hover: #3d2343;
    --accent-text: #f3ead9;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
    margin: 0;
    padding: 0;
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'EB Garamond', serif;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    padding: 24px;
  }

  .page {
    width: 100%;
    max-width: 560px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 20px;
  }

  .wordmark {
    font-family: 'EB Garamond', serif;
    font-size: 0.85rem;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--ink);
    font-weight: 600;
  }

  .hairline {
    width: 64px;
    height: 1px;
    background: var(--hairline);
    border: none;
    margin: 0;
  }

  .eyebrow {
    font-family: 'EB Garamond', serif;
    font-size: 0.75rem;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(2rem, 5vw, 3.1rem);
    line-height: 1.2;
    margin: 0;
    color: var(--ink);
    max-width: 14ch;
  }

  .subtext {
    font-family: 'EB Garamond', serif;
    font-size: clamp(0.95rem, 1.6vw, 1.1rem);
    line-height: 1.55;
    color: var(--ink-soft);
    max-width: 42ch;
    margin: 0;
  }

  form {
    display: flex;
    gap: 10px;
    width: 100%;
    max-width: 420px;
    margin-top: 6px;
  }

  input[type="email"] {
    flex: 1;
    min-width: 0;
    background: var(--input-bg);
    border: 1px solid var(--hairline);
    color: var(--ink);
    font-family: 'EB Garamond', serif;
    font-size: 1rem;
    padding: 12px 16px;
    border-radius: 2px;
    outline: none;
  }

  input[type="email"]::placeholder {
    color: var(--ink-soft);
    opacity: 0.7;
  }

  input[type="email"]:focus {
    border-color: var(--accent);
  }

  button {
    background: var(--accent);
    color: var(--accent-text);
    border: none;
    font-family: 'EB Garamond', serif;
    font-size: 0.85rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    padding: 12px 22px;
    border-radius: 2px;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.2s ease;
  }

  button:hover {
    background: var(--accent-hover);
  }

  button:disabled {
    opacity: 0.6;
    cursor: default;
  }

  .form-message {
    font-family: 'EB Garamond', serif;
    font-size: 0.9rem;
    min-height: 1.2em;
    margin: 0;
  }

  .form-message.success {
    color: var(--ink);
  }

  .form-message.error {
    color: #7a2e2e;
  }

  footer {
    font-family: 'EB Garamond', serif;
    font-size: 0.75rem;
    color: var(--ink-soft);
    margin-top: 4px;
  }

  @media (max-width: 480px) {
    form {
      flex-direction: column;
    }

    button {
      width: 100%;
    }
  }
</style>
</head>
<body>
  <main class="page">
    <div class="wordmark">Compostela Press</div>
    <hr class="hairline">
    <div class="eyebrow">Coming Soon</div>
    <h1>A letter for the Catholic house.</h1>
    <p class="subtext">Compostela Press writes on the feasts, the saints, and how to keep them at home. It goes out every week. Leave your email and the first one will find you.</p>

    <form id="signup-form" novalidate>
      <input type="email" name="email" id="email" placeholder="you@example.com" required aria-label="Email address">
      <button type="submit" id="submit-btn">Notify Me &rarr;</button>
    </form>
    <p class="form-message" id="form-message" role="status"></p>

    <footer>&copy; 2026 Compostela Press. All rights reserved.</footer>
  </main>

  <script>
    const form = document.getElementById('signup-form');
    const emailInput = document.getElementById('email');
    const submitBtn = document.getElementById('submit-btn');
    const messageEl = document.getElementById('form-message');

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      messageEl.textContent = '';
      messageEl.className = 'form-message';
      submitBtn.disabled = true;

      try {
        const response = await fetch('https://formspree.io/f/xbgrlopl', {
          method: 'POST',
          headers: {
            'Accept': 'application/json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ email: emailInput.value })
        });

        if (response.ok) {
          messageEl.textContent = "You're on the list. Thank you.";
          messageEl.classList.add('success');
          form.reset();
        } else {
          const data = await response.json().catch(() => null);
          const errorText = data && data.errors && data.errors.length
            ? data.errors.map(function (err) { return err.message; }).join(', ')
            : 'Something went wrong. Please try again.';
          messageEl.textContent = errorText;
          messageEl.classList.add('error');
        }
      } catch (err) {
        messageEl.textContent = 'Something went wrong. Please try again.';
        messageEl.classList.add('error');
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
